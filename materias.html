<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journalism</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <nav class="wrap">
    <div class="brand"><span class="dot"></span><span id="brandName">Portfólio</span></div>
    <div class="header-right">
      <a class="back-link" id="backLink" href="index.html">← <span id="backLabel">portfolio</span></a>
    </div>
  </nav>
</header>

<main class="wrap" style="padding-top:150px; padding-bottom:90px;">
  <div class="sec-head"><div class="sec-card"><h2 class="sec-title" id="pageTitle">Journalism</h2></div></div>
  <div class="media-grid" id="fullList"></div>
  <p class="empty-note" id="emptyNote" style="display:none;"></p>
</main>

<script>
  function esc(s){
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function titleOf(a){
    if (typeof a.title === 'string') return a.title;
    return (a.title && (a.title.en || a.title.pt)) || '';
  }

  const labels = {
    en: { pageTitle: 'Journalism — In English', thumbPlaceholder: 'photo/cover of the piece', back: 'portfolio', empty: 'Nothing published in this language yet.' },
    es: { pageTitle: 'Periodismo — En Español', thumbPlaceholder: 'foto/portada de la nota', back: 'portafolio', empty: 'Todavía no hay nada publicado en este idioma.' },
    pt: { pageTitle: 'Jornalismo — Em Português', thumbPlaceholder: 'foto/capa da matéria', back: 'portfólio', empty: 'Ainda não há nada publicado nesse idioma.' }
  };

  const params = new URLSearchParams(location.search);
  const lang = ['en', 'es', 'pt'].includes(params.get('lang')) ? params.get('lang') : 'en';
  const L = labels[lang];

  document.title = L.pageTitle;
  document.getElementById('pageTitle').textContent = L.pageTitle;
  document.getElementById('backLabel').textContent = L.back;
  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : lang;

  fetch('./data/content.json', { cache: 'no-store' })
    .then(r => r.json())
    .then(data => {
      document.getElementById('brandName').textContent = data.profile.name || 'Portfólio';

      const items = (data.articles || []).filter(a => (a.lang || 'pt') === lang);

      if (!items.length) {
        document.getElementById('emptyNote').textContent = L.empty;
        document.getElementById('emptyNote').style.display = 'block';
        return;
      }

      document.getElementById('fullList').innerHTML = items.map(a => `
        <a class="media-card" href="${esc(a.url || '#')}" target="_blank" rel="noopener">
          <div class="media-thumb">${a.image ? `<img src="${esc(a.image)}" alt="">` : esc(L.thumbPlaceholder)}</div>
          <div class="media-outlet">${esc(a.outlet)}</div>
          <h3>${esc(titleOf(a))}</h3>
        </a>`).join('');
    })
    .catch(() => {
      document.getElementById('emptyNote').textContent = 'Could not load content.';
      document.getElementById('emptyNote').style.display = 'block';
    });
</script>

</body>
</html>
